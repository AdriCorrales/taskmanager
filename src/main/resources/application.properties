spring.application.name=taskmanager
spring.h2.console.enabled=true
# PARA H2
#spring.datasource.url=jdbc:h2:mem:usersdb
spring.jpa.defer-datasource-initialization=true

spring.datasource.url=jdbc:mysql://localhost:3306/tasks-database
spring.datasource.username=tasks-user
spring.datasource.password=taskpassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.dialect=org.hibernate.dialect.MySQLDialect

spring.security.user.name=username
spring.security.user.password=password

server.error.include-stacktrace=never

